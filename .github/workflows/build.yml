name: Build and Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl urllib3 pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --clean --noconfirm main.py

      - name: Verify build artifact
        shell: powershell
        run: |
          if (-Not (Test-Path "dist/main.exe")) {
            Write-Error "dist/main.exe not found!"
            exit 1
          }

      - name: Package main.exe and data directory into ZIP
        shell: powershell
        run: |
          Compress-Archive -Path "dist/main.exe", "data" -DestinationPath "dist/release.zip" -Force

      # (선택) 아티팩트 업로드는 유지하거나 삭제 가능 (로그인해야 보이는 용도)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scrape-kor-libs-windows
          path: |
            dist/main.exe
            data

      # 기존 "Create or Update GitHub Release" 단계를 아래 내용으로 교체
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Release v1.0.${{ github.run_number }}"
          body: "Automated build release"
          files: dist/release.zip
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
