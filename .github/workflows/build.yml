name: Build and Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 openpyxl urllib3 pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --clean --noconfirm main.py

      - name: Verify build artifact
        shell: powershell
        run: |
          if (-Not (Test-Path "dist/main.exe")) {
            Write-Error "dist/main.exe not found!"
            exit 1
          }

      - name: Package main.exe and data directory into ZIP
        shell: powershell
        run: |
          Compress-Archive -Path "dist/main.exe", "data" -DestinationPath "dist/release.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: scrape-kor-libs-windows
          path: |
            dist/main.exe
            data

      - name: Create or Update GitHub Release
        shell: powershell
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "dist/release.zip" --title "Release v1.0.${{ github.run_number }}" --notes "Automated build release" --latest --clobber
